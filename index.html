<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compiler Design Programs</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Compiler Design Lab</p>
      <h1>Lex and Yacc Programs</h1>
    </div>
    <nav class="tabs" aria-label="Program navigation">
      <button class="tab active" data-program="prog1">Prog 1</button>
      <button class="tab" data-program="prog2">Prog 2</button>
      <button class="tab" data-program="prog3">Prog 3</button>
      <button class="tab" data-program="prog4">Prog 4</button>
      <button class="tab" data-program="prog5">Prog 5</button>
    </nav>
  </header>

  <main>
    <section class="intro">
      <h2 id="programTitle">Program 1</h2>
      <p id="programText">Lex and Yacc lab programs with code, input, and Ubuntu run commands.</p>
    </section>
    <section id="programContainer" class="program-grid" aria-live="polite"></section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite">Copied</div>

  <script src="app.js"></script>
</body>
</html>
